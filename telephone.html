<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zak">
<meta name="theme-color" content="#173a2c">
<title>Zak — micro de ZAKMETRE</title>
<style>
  :root{--vert:#1f4d3a;--vert-f:#173a2c;--clair:#eef4f0;--fond:#f6f3ec;--texte:#1d2420;--gris:#6b746f;--rouge:#b3261e;--ok:#2e7d32}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--fond);color:var(--texte);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{display:flex;flex-direction:column;min-height:100dvh}
  header{background:var(--vert-f);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--vert-f);display:grid;place-items:center;font-weight:800}
  header h1{font-size:17px;margin:0;line-height:1.2}
  header small{display:block;font-size:12.5px;opacity:.8}
  #lien{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.14);white-space:nowrap;display:flex;align-items:center;gap:6px}
  #point{width:8px;height:8px;border-radius:50%;background:#9aa59f}
  #point.on{background:#6fdc8c}
  main{flex:1;display:flex;flex-direction:column;max-width:720px;width:100%;margin:0 auto;padding:12px 12px 0}
  #conv{flex:1;overflow-y:auto;padding:6px 2px 10px;display:flex;flex-direction:column;gap:10px;min-height:200px}
  .msg{max-width:86%;padding:10px 13px;border-radius:16px;font-size:15.5px;white-space:pre-wrap}
  .toi{align-self:flex-end;background:var(--vert);color:#fff;border-bottom-right-radius:5px}
  .toi.attente{opacity:.6}
  .zak{align-self:flex-start;background:#fff;border-bottom-left-radius:5px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .info{align-self:center;font-size:13px;color:var(--gris);text-align:center;max-width:92%}
  .err{align-self:center;font-size:13.5px;color:var(--rouge);background:#fdecea;padding:8px 12px;border-radius:12px;max-width:92%}
  .ok{align-self:center;background:#e4f3e7;color:var(--ok);font-weight:600;padding:8px 14px;border-radius:12px;font-size:14px}
  .bas{position:sticky;bottom:0;background:linear-gradient(transparent,var(--fond) 18px);padding:14px 0 calc(14px + env(safe-area-inset-bottom))}
  #zoneMic{display:flex;flex-direction:column;align-items:center;gap:8px}
  #parler{position:relative;width:104px;height:104px;border-radius:50%;border:none;background:var(--vert);color:#fff;font-size:14px;font-weight:600;
          box-shadow:0 6px 18px rgba(23,58,44,.35);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
  #parler svg{width:36px;height:36px;display:block;margin:0 auto 2px}
  #parler.actif{background:var(--rouge);transform:scale(1.06)}
  #parler.attente{background:#7d8a83}
  #halo{position:absolute;inset:-10px;border-radius:50%;border:4px solid transparent;transition:border-color .08s}
  #aide{font-size:13px;color:var(--gris);text-align:center;min-height:18px}
  .ligne{display:flex;gap:8px;margin-top:10px}
  #ecrit{flex:1;padding:11px 14px;border-radius:22px;border:1px solid #d6dbd7;font-size:16px;background:#fff}
  #envoyer{border:none;background:var(--vert);color:#fff;border-radius:22px;padding:0 16px;font-weight:600}
  details{margin:10px 0 0;font-size:14px;color:var(--gris)}
  details select{width:100%;margin:4px 0 8px;padding:8px;border-radius:10px;border:1px solid #d6dbd7;font-size:14px;background:#fff}
  .lien{background:none;border:none;color:var(--vert);text-decoration:underline;font-size:13px;padding:0}
  #debut{position:fixed;inset:0;background:rgba(23,58,44,.97);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
         gap:16px;padding:30px;text-align:center;z-index:9}
  #debut h2{margin:0;font-size:22px}
  #debut p{margin:0;opacity:.88;max-width:420px}
  #debut button{background:#fff;color:var(--vert-f);border:none;border-radius:30px;padding:15px 28px;font-size:17px;font-weight:700}
  #code{font:600 26px/1 ui-monospace,Menlo,monospace;letter-spacing:.25em;text-transform:uppercase;text-align:center;width:220px;padding:12px;border-radius:14px;border:none}
  #debutErr{color:#ffd2cc;font-size:14px;min-height:20px}
</style>
</head>
<body>
<header>
  <div class="logo">Z</div>
  <div><h1>Zak</h1><small>micro de ZAKMETRE</small></div>
  <div id="lien"><span id="point"></span><span id="lienTxt">…</span></div>
</header>

<main>
  <div id="conv"></div>
  <div class="bas">
    <div id="zoneMic">
      <button id="parler" aria-label="Maintenir pour parler"><span id="halo"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <span id="lib">Parler</span></button>
      <div id="aide">Maintiens le bouton pendant que tu parles</div>
    </div>
    <div class="ligne"><input id="ecrit" placeholder="…ou écris ici" enterkeyhint="send"><button id="envoyer">Envoyer</button></div>
    <details><summary>Réglages</summary>
      Micro<select id="micro"><option value="">Micro par défaut</option></select>
      <button class="lien" id="delier">Délier ce téléphone de ZAKMETRE</button>
    </details>
  </div>
</main>

<div id="debut">
  <h2>Zak 👋</h2>
  <div id="etapeCode" hidden>
    <p>Sur l'ordi, dans ZAKMETRE : bouton <b>Zak</b> → <b>📱 Micro sur téléphone</b>.<br>Scanne le QR code, ou tape le code affiché :</p>
    <p style="margin-top:14px"><input id="code" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false"></p>
    <p style="margin-top:14px"><button id="relier">Relier</button></p>
  </div>
  <div id="etapeGo" hidden>
    <p>Ce téléphone est relié à ZAKMETRE.<br>Tu parles ici, Zak travaille sur l'ordi et te répond ici.</p>
    <p style="margin-top:16px"><button id="commencer">Activer le micro</button></p>
  </div>
  <div id="debutErr"></div>
</div>

<script>
var $ = function (id) { return document.getElementById(id); };
function echapper(t) { return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function ajouter(classe, html) {
  var d = document.createElement("div"); d.className = (/^(info|err|ok)$/.test(classe) ? "" : "msg ") + classe; d.innerHTML = html;
  $("conv").appendChild(d); $("conv").scrollTop = $("conv").scrollHeight; return d;
}

// ---------------- liaison (gardée sur ce téléphone)
var LIAISON = null;
try { LIAISON = JSON.parse(localStorage.getItem("zak_liaison") || "null"); } catch (e) {}
function entetes() { return { "Content-Type": "application/json", "X-Cle": LIAISON.cle }; }
function api(chemin, corps) {
  var o = corps === undefined ? { headers: entetes() } : { method: "POST", headers: entetes(), body: JSON.stringify(corps) };
  return fetch("/relais/" + LIAISON.id + chemin, o).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (d) {
      if (r.status === 403) { oublier(); throw "Liaison refusée : rescanne le QR code."; }
      if (!r.ok || d.erreur) throw d.erreur || "Le relais ne répond pas.";
      return d;
    });
  });
}
function oublier() { try { localStorage.removeItem("zak_liaison"); } catch (e) {} LIAISON = null; }
function relier(code) {
  $("debutErr").textContent = "";
  return fetch("/relais/appairer", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: code }) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.erreur) throw d.erreur;
      LIAISON = { id: d.id, cle: d.cle };
      try { localStorage.setItem("zak_liaison", JSON.stringify(LIAISON)); } catch (e) {}
      montrerDebut();
    })
    .catch(function (e) { $("debutErr").textContent = typeof e === "string" ? e : "Pas de connexion."; montrerDebut(); });
}
function montrerDebut() { $("etapeCode").hidden = !!LIAISON; $("etapeGo").hidden = !LIAISON; }

var pcEnLigne = false;
function lien(on) {
  pcEnLigne = on;
  $("point").classList.toggle("on", on);
  $("lienTxt").textContent = on ? "ordi relié" : "ordi absent";
}
function verifierPc() {
  if (!LIAISON || occupe) return;
  api("/etat").then(function (d) { lien(!!d.pc_en_ligne); }).catch(function () { lien(false); });
}

// ---------------- son de Zak (un seul lecteur, débloqué au 1er toucher : obligatoire sur iPhone)
var LECTEUR = new Audio();
var SILENCE = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=";
function jouer(b64) {
  if (!b64) return;
  try { LECTEUR.src = "data:audio/mpeg;base64," + b64; LECTEUR.play().catch(function () {}); } catch (e) {}
}
function couperZak() { try { LECTEUR.pause(); } catch (e) {} }

// ---------------- micro : ouvert une fois, 0,4 s gardé AVANT l'appui (le début de la phrase n'est pas coupé)
var ctx = null, flux = null, source = null, proc = null, enCours = false, morceaux = [], anneau = [], tAppui = 0, niveau = 0, occupe = false;
var AVANT = 0.4;
function ouvrirMicro() {
  var id = $("micro").value;
  var a = { noiseSuppression: true, echoCancellation: true, autoGainControl: true };
  if (id) a.deviceId = { exact: id };
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === "suspended") ctx.resume();
  if (flux) { flux.getTracks().forEach(function (t) { t.stop(); }); flux = null; }
  if (proc) { try { proc.disconnect(); source.disconnect(); } catch (e) {} }
  return navigator.mediaDevices.getUserMedia({ audio: a }).then(function (f) {
    flux = f; source = ctx.createMediaStreamSource(f); proc = ctx.createScriptProcessor(2048, 1, 1);
    var garder = Math.ceil(AVANT * ctx.sampleRate / 2048);
    proc.onaudioprocess = function (e) {
      var x = new Float32Array(e.inputBuffer.getChannelData(0));
      var m = 0; for (var i = 0; i < x.length; i += 16) { var v = Math.abs(x[i]); if (v > m) m = v; }
      niveau = Math.max(niveau * 0.85, m);
      $("halo").style.borderColor = enCours ? "rgba(255,255,255," + Math.min(0.9, niveau * 4) + ")" : "transparent";
      if (enCours) morceaux.push(x); else { anneau.push(x); if (anneau.length > garder) anneau.shift(); }
    };
    source.connect(proc); proc.connect(ctx.destination);
    navigator.mediaDevices.enumerateDevices().then(function (ds) {
      var ms = ds.filter(function (d) { return d.kind === "audioinput" && d.label && d.deviceId !== "default"; });
      if (ms.length < 2) return;
      var avant = $("micro").value;
      $("micro").innerHTML = ms.map(function (d) { return '<option value="' + d.deviceId + '">' + echapper(d.label) + "</option>"; }).join("");
      if (avant) $("micro").value = avant;
    });
  });
}
function appuyer(e) {
  if (e) e.preventDefault();
  if (enCours || occupe || !flux) return;
  couperZak();
  if (ctx.state === "suspended") ctx.resume();
  enCours = true; tAppui = performance.now(); morceaux = anneau.slice(); anneau = [];
  $("parler").classList.add("actif"); $("lib").textContent = "J'écoute"; $("aide").textContent = "Lâche quand tu as fini";
}
function lacher() {
  if (!enCours) return;
  enCours = false;
  $("parler").classList.remove("actif"); $("lib").textContent = "Parler"; $("aide").textContent = "Maintiens le bouton pendant que tu parles";
  var duree = (performance.now() - tAppui) / 1000;
  if (duree < 0.5) { ajouter("info", "Maintiens le bouton <b>pendant</b> que tu parles, puis lâche."); return; }
  if (duree > 58) { ajouter("info", "Message trop long : une minute maximum."); return; }
  var maxi = 0; morceaux.forEach(function (b) { for (var i = 0; i < b.length; i += 8) { var a = Math.abs(b[i]); if (a > maxi) maxi = a; } });
  if (maxi < 0.004) { ajouter("err", "Je n'entends rien : vérifie le micro."); return; }
  versBase64(versWav(morceaux, ctx.sampleRate)).then(function (b64) { envoyer({ audio: b64 }, "…"); });
}
function versWav(bouts, rate) {
  var n = bouts.reduce(function (t, b) { return t + b.length; }, 0), tout = new Float32Array(n), k = 0;
  bouts.forEach(function (b) { tout.set(b, k); k += b.length; });
  var cible = 16000, pas = rate / cible, m = Math.floor(n / pas), pcm = new DataView(new ArrayBuffer(44 + m * 2));
  var w = function (o, s) { for (var i = 0; i < s.length; i++) pcm.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); pcm.setUint32(4, 36 + m * 2, true); w(8, "WAVE"); w(12, "fmt "); pcm.setUint32(16, 16, true); pcm.setUint16(20, 1, true);
  pcm.setUint16(22, 1, true); pcm.setUint32(24, cible, true); pcm.setUint32(28, cible * 2, true); pcm.setUint16(32, 2, true); pcm.setUint16(34, 16, true);
  w(36, "data"); pcm.setUint32(40, m * 2, true);
  for (var i = 0; i < m; i++) {
    var a = Math.floor(i * pas), b = Math.min(n, Math.floor((i + 1) * pas)), s = 0;
    for (var j = a; j < b; j++) s += tout[j];
    var x = Math.max(-1, Math.min(1, s / Math.max(1, b - a)));
    pcm.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7fff, true);
  }
  return new Blob([pcm], { type: "audio/wav" });
}
function versBase64(blob) {
  return new Promise(function (ok) { var r = new FileReader(); r.onload = function () { ok(String(r.result).split(",")[1] || ""); }; r.readAsDataURL(blob); });
}

// ---------------- envoi -> l'ordi travaille -> réponse
function envoyer(corps, apercu) {
  occupe = true; $("parler").classList.add("attente"); $("lib").textContent = "…";
  var bulle = ajouter("toi attente", echapper(apercu));
  api("/message", corps).then(function (d) {
    if (!d.pc_en_ligne) ajouter("info", "ZAKMETRE n'a pas l'air ouvert sur l'ordi. J'attends un peu…");
    return attendreReponse(d.n, Date.now() + 90000);
  }).then(function (r) {
    lien(true);
    if (r.erreur) { bulle.remove(); ajouter("err", echapper(r.erreur)); return; }
    if (r.entendu) { bulle.textContent = r.entendu; bulle.classList.remove("attente"); } else bulle.remove();
    if (r.texte) ajouter("zak", echapper(r.texte));
    if (r.action) ajouter("ok", "✓ " + echapper(r.action));
    jouer(r.audio);
  }).catch(function (e) {
    bulle.remove();
    ajouter("err", echapper(typeof e === "string" ? e : "Pas de connexion."));
  }).then(fini);
}
function attendreReponse(n, limite) {
  return api("/reponse?n=" + n).then(function (d) {
    if (d.pret) return d;
    lien(!!d.pc_en_ligne);
    if (Date.now() > limite) throw "L'ordi ne répond pas : ZAKMETRE est-il ouvert, avec Zak relié au téléphone ?";
    return attendreReponse(n, limite);
  });
}
function fini() { occupe = false; $("parler").classList.remove("attente"); $("lib").textContent = "Parler"; }

// ---------------- démarrage
var parametres = new URLSearchParams(location.search);
var codeUrl = (parametres.get("c") || "").toUpperCase();
if (codeUrl) history.replaceState(null, "", "/tel");      // le code ne reste pas dans l'adresse (usage unique)
if (codeUrl && !LIAISON) relier(codeUrl); else if (codeUrl) { oublier(); relier(codeUrl); } else montrerDebut();

$("relier").onclick = function () { var c = $("code").value.trim(); if (c.length === 6) relier(c); };
$("code").addEventListener("keydown", function (e) { if (e.key === "Enter") $("relier").click(); });
$("commencer").onclick = function () {
  try { LECTEUR.src = SILENCE; LECTEUR.play().catch(function () {}); } catch (e) {}
  ouvrirMicro().then(function () {
    $("debut").remove();
    ajouter("info", "Relié à ZAKMETRE. Maintiens le bouton et parle à Zak.");
    verifierPc(); setInterval(verifierPc, 10000);
  }).catch(function () {
    $("debutErr").textContent = "Le micro est refusé. Réglages de l'iPhone → Safari → Micro → Autoriser, puis recharge la page.";
  });
};
$("delier").onclick = function () { oublier(); location.href = "/tel"; };
var b = $("parler");
b.addEventListener("pointerdown", appuyer);
b.addEventListener("pointerup", lacher);
b.addEventListener("pointercancel", lacher);
b.addEventListener("contextmenu", function (e) { e.preventDefault(); });
var envoyerEcrit = function () {
  var t = $("ecrit").value.trim(); if (!t || occupe || !LIAISON) return;
  $("ecrit").value = ""; couperZak(); envoyer({ texte: t }, t);
};
$("envoyer").onclick = envoyerEcrit;
$("ecrit").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); envoyerEcrit(); } });
$("micro").onchange = function () { ouvrirMicro().catch(function () { ajouter("err", "Ce micro ne s'ouvre pas."); }); };
</script>
</body>
</html>
